name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned: GitHub starts moving ubuntu-latest to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # The official postgres:16 image, pulled from AWS's mirror of Docker Hub's library
        # (Docker Hub pulls failed four times in a row on 2026-10-09).
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: game
          POSTGRES_PASSWORD: game
          POSTGRES_DB: game_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U game -d game_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # tests/test_postgres.py runs the game against PostgreSQL (the rest of the suite uses SQLite).
      TEST_POSTGRES_URL: postgresql://game:game@localhost:5432/game_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
